<section id="homeSection" class="min-h-screen">
  <div class="container mx-auto p-4 md:p-8 max-w-6xl">
    <header class="flex items-center justify-between mb-8">
      <div id="homeStats" class="flex items-center gap-4 text-sm text-slate-500">
        </div>
      <div class="text-center">
        <h1 class="text-3xl md:text-4xl font-extrabold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
          StudySet
        </h1>
        <p class="text-slate-500 text-sm mt-1">Master your flashcards</p>
      </div>
      <div class="flex items-center gap-2">
        <div id="micIndicator" class="text-slate-300 p-2 cursor-help" title="Free voices (browser)">
          <span class="material-symbols-outlined">mic</span>
        </div>
        <button id="homeSettingsBtn" class="p-2 text-slate-400 hover:text-slate-600 hover:bg-slate-100 rounded-lg transition-colors" aria-label="Settings">
          <span class="material-symbols-outlined">settings</span>
        </button>
        <button id="homeCreateSetBtn" class="flex items-center gap-2 bg-indigo-600 text-white font-semibold py-2 px-4 rounded-lg hover:bg-indigo-700 transition-all hover:scale-105 shadow-md">
          <span class="material-symbols-outlined">add</span> Create Set
        </button>
        <button id="navAdminPanelBtn" class="hidden bg-slate-800 text-white px-4 py-2 rounded-xl font-semibold hover:bg-slate-900 transition-colors flex items-center gap-2 shadow-sm ml-2">
          <span class="material-symbols-outlined">admin_panel_settings</span> Admin Panel
        </button>
      </div>
    </header>
    <div id="studyArea">
      <div id="homeQuickActions" class="hidden flex flex-wrap gap-3 mb-8 items-center w-full">
        <select id="quickActionStudy" class="bg-green-500 text-white font-semibold py-2 px-4 rounded-lg outline-none cursor-pointer hover:bg-green-600 transition-colors appearance-none shadow-sm">
          <option value="all">📚 Chọn cấp độ</option>
          <option value="easy">🟢 Dễ(A1, A2)</option>
          <option value="medium">🟡 Trung bình (B1, B2)</option>
          <option value="hard">🔴 Khó (C1, C2)</option>
        </select>
        <div id="editorSearchContainer" class="relative flex-grow max-w-md hidden">
          <input type="text" style="display:none" aria-hidden="true">
          <input type="password" style="display:none" aria-hidden="true">
          <span class="material-symbols-outlined absolute left-3 top-2.5 text-slate-400">search</span>
          <input type="search" autocomplete="new-password" id="editorSearchInput" placeholder="Tìm kiếm bộ từ vựng (VD: Family, Work...)" class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 transition-all shadow-sm text-slate-700">
        </div>
        <button id="quickActionDue" class="flex items-center gap-2 bg-orange-500 text-white font-medium py-2 px-4 rounded-lg hover:bg-orange-600 transition-all shadow-sm">
          <span class="material-symbols-outlined">schedule</span> Tổng từ đã học(<span class="due-count">0</span>)
        </button>
        <button id="quickActionRandom" class="flex items-center gap-2 bg-purple-500 text-white font-medium py-2 px-4 rounded-lg hover:bg-purple-600 transition-all shadow-sm">
          <span class="material-symbols-outlined">shuffle</span> Chủ đề ngẫu nhiên
        </button>
      </div>

      <div id="homeResumeSection" class="hidden mb-8">
        <h2 class="text-lg font-semibold text-slate-700 mb-3 flex items-center gap-2">
          <span class="material-symbols-outlined text-indigo-600">bookmark</span> Pick up where you left off
        </h2>
        <button id="homeResumeCard" class="w-full bg-white p-5 rounded-xl shadow-md border border-slate-200 hover:border-indigo-400 hover:shadow-lg transition-all text-left">
          </button>
      </div>

      <div>
        <h2 class="text-lg font-semibold text-slate-700 mb-4 flex items-center gap-2">
          <span class="material-symbols-outlined text-indigo-600">library_books</span> Your Study Sets
        </h2>
        <div id="homeSetGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          </div>
      </div>
    </div>
  </div>
  <header class="flex justify-between items-center p-4 bg-white shadow-sm">
    <h1 class="text-xl font-bold text-indigo-600">Quizlet</h1>
    <div class="flex items-center gap-2">
      <button id="homeSettingsBtn">...</button>
      <button id="logoutBtn" class="px-4 py-2 text-sm font-medium text-slate-600 hover:text-red-600 hover:bg-red-50 rounded-lg transition-all flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
        </svg> Logout
      </button>
    </div>
  </header>
  <div id="adminView" class="hidden max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-3xl font-bold text-slate-800 mb-6">User Account Management</h2>
    <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
      <table class="w-full text-left">
        <thead class="bg-slate-50 border-b border-slate-200">
          <tr>
            <th class="px-6 py-4 font-semibold text-slate-700">ID</th>
            <th class="px-6 py-4 font-semibold text-slate-700">Username</th>
            <th class="px-6 py-4 font-semibold text-slate-700">Email</th>
            <th class="px-6 py-4 font-semibold text-slate-700">Role</th>
            <th class="px-6 py-4 font-semibold text-slate-700 text-right">Activity</th>
          </tr>
        </thead>
        <tbody id="adminUserTableBody" class="divide-y divide-slate-100">
          </tbody>
      </table>
    </div>
  </div>
</section>
